name: Si-28 QRNG Seed Generator

on:
  workflow_dispatch: # 수동 단발성 실행 (Actions 탭에서 직접 버튼으로 실행 가능)
  schedule:
    - cron: '0 0 * * *' # 주기적 자동 실행 (매일 UTC 0시)

jobs:
  generate-and-commit-seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 생성된 .npy 파일 자동 커밋·푸시 권한

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Quantum Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cirq numpy numba pytest scipy

      - name: 4. Execute QRNG Seed Generation Script
        run: |
          python generate_seed.py

      - name: 5. Auto-Commit and Push Seed File (.npy)
        run: |
          git config --global user.name "Si28-QRNG-Bot"
          git config --global user.email "actions@github.com"
          git add data/verified_si28_bits.npy
          git commit -m "chore(qrng): auto-generate and publish verified Si-28 physical seed [skip ci]" || echo "No changes to commit"
          git push
